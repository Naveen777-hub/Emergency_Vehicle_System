services:
  - type: web
    name: evps-backend
    runtime: python
    region: singapore  # Closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 200
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: evps-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: evps-db
    plan: free
    databaseName: evps
    region: singapore
