{% extends "base.html" %}
{% block title %}Page Not Found — EVPS{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-box" style="max-width:500px;">
    <div class="login-box-head">
      <h2>404 — Page Not Found</h2>
      <p>The page you requested does not exist or has been moved.</p>
    </div>
    <div class="login-box-body" style="text-align:center;">
      <div style="font-size:72px; color:var(--text-muted); margin-bottom:16px;">🔍</div>
      <p class="text-muted">If you believe this is an error, contact the system administrator.</p>
      <div style="margin-top:20px;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
